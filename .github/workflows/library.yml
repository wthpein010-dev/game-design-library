name: Update and publish library
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: Fetch feeds and backfill historical metadata
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sync_outcome: ${{ steps.sync.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch new and historical metadata
        id: sync
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        continue-on-error: true
        run: python scripts/sync.py --limit 8
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm ci --ignore-scripts
      - run: npm run test:core
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Record source changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/data site/tokens.css
          if ! git diff --cached --quiet; then
            git commit -m 'data: synchronize public learning resources'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report all-source failure after preserving status page
        if: needs.build.outputs.sync_outcome == 'failure'
        run: echo 'All source fetches failed. Previous resources and failure report have been preserved.'; exit 1
